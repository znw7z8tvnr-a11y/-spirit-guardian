<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101a30"><title>靈境守衛｜手機試玩</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1426;color:#eef5ff;font:14px -apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif}main{max-width:620px;margin:auto;padding:12px}h1{font-size:22px;margin:2px 0}h2{font-size:16px;margin:4px 0 10px}button{background:#243a59;color:white;border:1px solid #577398;border-radius:10px;padding:11px 8px;font:inherit;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.45}.primary{background:#276e9c;border-color:#6eb9f0;font-weight:bold}.top{display:flex;justify-content:space-between;align-items:center}.small{font-size:12px;color:#b8c9e4}.stats{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.stat{background:#1a2b46;border-radius:7px;padding:7px;font-size:12px}canvas{width:100%;aspect-ratio:1;display:block;background:#18382f;border:1px solid #53716d;border-radius:13px;touch-action:none}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:9px 0}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0 8px}.tabs button{padding:10px 2px}.tabs .on{background:#3b709d}.panel{background:#182841;border:1px solid #324a6d;border-radius:13px;padding:12px;min-height:175px}.line{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:9px 0}.line button{min-width:98px}.node{background:#263c5d;border-radius:9px;padding:12px;line-height:1.9;margin:10px 0}.notice{background:#243a55;border-radius:8px;padding:10px;margin:8px 0;min-height:36px}.muted{font-size:12px;line-height:1.6;color:#bdcbe1}.row{display:flex;flex-wrap:wrap;gap:7px}.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;margin:8px 0}.quick button{padding:9px 2px;font-size:12px;background:#30445e}.quick button:disabled{opacity:.32}canvas{max-height:min(72vh,620px);object-fit:contain}.overlay{z-index:20;position:fixed;inset:0;background:#06101ce8;display:none;align-items:center;justify-content:center;padding:20px}.dialog{max-width:430px;width:100%;background:#1d2e4a;border:1px solid #7292b6;border-radius:15px;padding:18px}.dialog button{margin:5px 5px 0 0}</style></head><body><main><div class="top"><div><h1>🏰 靈境守衛</h1><div class="small">手機完整測試版 v0.4 · 10 波挑戰</div></div><div class="small" id="state">準備中</div></div><div class="stats" id="stats"></div><canvas id="field" width="600" height="600"></canvas><div class="actions"><button class="primary" id="start">▶ 開始波次</button><button id="pause">⏸ 暫停</button><button id="speed">⏩ 1×</button></div><div class="quick"><button id="skillFire">🔥 火球</button><button id="skillIce">❄️ 冰槍</button><button id="skillBolt">⚡ 雷擊</button><button id="skillArc">🔮 奧術</button></div><div class="notice" id="notice">先到「魔法」按一鍵自動安裝，再開始防守。</div><div class="tabs"><button class="on" data-tab="fight">⚔️ 戰鬥</button><button data-tab="magic">✨ 魔法</button><button data-tab="castle">🏰 城堡</button><button data-tab="info">📖 研究</button></div><div class="panel" id="panel"></div><p class="muted">玩法：怪物從四面八方自由靠近。點擊敵人指定優先目標。波次間可升級技能、城堡；進度自動儲存在目前瀏覽器。</p></main><div class="overlay" id="overlay"><div class="dialog"><h2 id="dialogTitle"></h2><div id="dialogText"></div><div id="dialogButtons" class="row"></div></div></div><script>
(()=>{'use strict';const $=id=>document.getElementById(id),cv=$('field'),g=cv.getContext('2d');const defs={fire:{name:'火球',d:30,cd:1.5,col:'#ff9456'},ice:{name:'冰槍',d:24,cd:1.2,col:'#a2e8ff'},bolt:{name:'雷擊',d:36,cd:2,col:'#ffe27b'},arc:{name:'奧術飛彈',d:22,cd:.7,col:'#d5a8ff'}};const fresh=()=>({v:1,wave:0,crystal:110,hp:1000,max:1000,shield:150,shieldMax:150,wall:0,tower:0,radar:0,skills:{fire:1,ice:1,bolt:0,arc:0},gem:'hit',gemLevel:1,tree:false,kills:0,highest:0});let s=fresh();try{const o=JSON.parse(localStorage.getItem('spirit-guardian-demo-v1'));if(o&&o.v===1&&o.skills)s={...fresh(),...o,gemLevel:o.gemLevel||1}}catch(e){}let effects=[],projectiles=[],chainCount=0,lastChainOrigin=null,chainOriginCount=0,active=false,paused=false,modal=false,won=false,tab='fight',speed=1,enemies=[],shots=[],spawned=0,total=0,spawnClock=0,castClock=0,childClock=0,towerClock=0,boltClock=0,arcClock=0,selected=null,seq=0,last=0,uiClock=0,usedRepair=false;const save=()=>{try{localStorage.setItem('spirit-guardian-demo-v1',JSON.stringify(s))}catch(e){}};const note=t=>$('notice').textContent=t;const rand=(a,b)=>a+Math.random()*(b-a);const spend=n=>{if(s.crystal<n){note('魔力結晶不足');return false}s.crystal-=n;return true};const upcost=[20,45,90,160];function upgradeSkill(k){if(active&&!paused)return note('請先暫停');let lv=s.skills[k],price=lv?upcost[lv-1]:({bolt:65,arc:55}[k]||0);if(lv>=5)return;if(spend(price)){s.skills[k]++;save();render();note(defs[k].name+' 升級成功')}}function upgradeCastle(k){if(active&&!paused)return note('請先暫停');let lv=s[k],price=[35,60,95,140][lv];if(lv>=4)return;if(spend(price)){s[k]++;if(k==='wall'){s.max+=250;s.hp+=250}if(k==='radar'){s.shieldMax+=50;s.shield+=50}save();render();note('城堡強化成功')}}function auto(){if(active&&!paused)return note('請先暫停');s.tree=true;save();render();note('已自動安裝：火球命中點 → '+(s.gem==='hit'?'命中':'計時')+'寶石 → 冰槍'+(s.gemLevel>=2&&s.skills.bolt?' → 雷擊':'')+'。未消耗資源。')}
function dialog(title,text,buttons){modal=true;paused=true;$('overlay').style.display='flex';$('dialogTitle').textContent=title;$('dialogText').textContent=text;const root=$('dialogButtons');root.innerHTML='';buttons.forEach(b=>{let btn=document.createElement('button');btn.textContent=b[0];btn.onclick=()=>{$('overlay').style.display='none';modal=false;b[1]();render()};root.appendChild(btn)})}
function spawn(){let w=s.wave,r=Math.random(),kind='normal';if(w>=7&&r<.16)kind='stealth';else if(w>=8&&r<.26)kind='burrow';else if(w>=5&&r<.39)kind='fly';else if(w>=4&&r<.53)kind='armor';else if(w>=2&&r<.72)kind='fast';if(w===10&&spawned===total-1)kind='boss';let cfg={normal:[1,23,12,'#edbc84'],fast:[.7,36,10,'#f5dc6d'],armor:[2.2,14,15,'#b9a3cc'],stealth:[.8,30,11,'#a97bff'],fly:[.8,34,12,'#7bdcf0'],burrow:[1.3,19,12,'#c69c65'],boss:[11,12,26,'#ff658e']}[kind];let a=rand(0,Math.PI*2),r0=rand(305,335),hp=60*Math.pow(1.1,w-1)*cfg[0];enemies.push({id:++seq,x:300+Math.cos(a)*r0,y:300+Math.sin(a)*r0,hp,max:hp,speed:cfg[1],radius:cfg[2],color:cfg[3],kind,attack:0,reveal:0,slow:0,burn:0,phase:rand(0,5)});spawned++}
function visible(e){return (e.kind!=='stealth'&&e.kind!=='burrow')||e.reveal>0||Math.hypot(e.x-300,e.y-300)<65+s.radar*48}function target(){let es=enemies.filter(e=>e.hp>0&&visible(e));let chosen=es.find(e=>e.id===selected);return chosen||es.sort((a,b)=>Math.hypot(a.x-300,a.y-300)-Math.hypot(b.x-300,b.y-300))[0]}
function damage(e,amount,kind){if(e.hp<=0)return false;const before=e.hp;e.hp-=amount*(e.kind==='armor'&&kind!=='bolt'?.72:1);if(kind==='fire'){e.burn=Math.max(e.burn,2);e.reveal=2.5}if(kind==='ice')e.slow=2;if(kind==='bolt'||kind==='arc')e.reveal=2;if(e.hp<=0){s.kills++;s.crystal+=e.kind==='boss'?70:2+Math.floor(s.wave/5)}return before>0}
function cast(k,origin,targetEnemy,depth=0){let e=targetEnemy&&targetEnemy.hp>0?targetEnemy:target();if(!e||!s.skills[k])return false;let d=defs[k],amount=d.d*[1,1.2,1.45,1.75,2.1][s.skills[k]-1];let ox=origin?origin.x:300,oy=origin?origin.y:300;projectiles.push({kind:k,ox,oy,tx:e.x,ty:e.y,target:e,amount,depth,life:k==='bolt'?.18:.32,max:k==='bolt'?.18:.32,col:d.col});return true}
function impact(p){
 let e=p.target,x=e&&e.hp>0?e.x:p.tx,y=e&&e.hp>0?e.y:p.ty;
 const origin={x,y};let hit=false;
 if(p.kind==='fire'){
  const victims=enemies.filter(z=>z.hp>0&&Math.hypot(z.x-x,z.y-y)<48);
  for(const z of victims)hit=damage(z,p.amount,'fire')||hit;
 }else if(e&&e.hp>0){
  hit=damage(e,p.amount,p.kind);
  if(p.kind==='bolt'){
   for(const z of enemies.filter(z=>z!==e&&z.hp>0&&Math.hypot(z.x-x,z.y-y)<85).slice(0,2)){
    beam(x,y,z.x,z.y,'#ffe27b');damage(z,p.amount*.4,'bolt')
   }
  }
 }
 burst(p.kind,x,y,p.amount);
 // Parent event comes from the impact coordinate, never the castle.
 if(hit&&s.tree&&p.depth<2&&['fire','ice'].includes(p.kind)){
  if(p.kind==='fire'){lastChainOrigin=origin;chainOriginCount++;if(s.gem==='hit'&&Math.random()<.35+.1*(s.gemLevel-1))triggerChain(origin,'ice',1)}
  if(p.kind==='ice'&&s.gemLevel>=2&&s.skills.bolt&&Math.random()<.3)triggerChain(origin,'bolt',2);
 }
}
function triggerChain(origin,skill='ice',depth=1){
 if(!origin||!s.skills[skill]||chainCount>75)return false;
 let options=enemies.filter(e=>e.hp>0&&visible(e));
 if(!options.length)return false;
 options.sort((a,b)=>Math.hypot(a.x-origin.x,a.y-origin.y)-Math.hypot(b.x-origin.x,b.y-origin.y));
 let e=options[0];
 if(cast(skill,origin,e,depth)){
  chainCount++;beam(origin.x,origin.y,e.x,e.y,defs[skill].col);
  return true
 }
 return false
}
function beam(x1,y1,x2,y2,col){effects.push({kind:'beam',x:x1,y:y1,tx:x2,ty:y2,col,life:.28,max:.28})}
function update(dt){if(!active||paused||modal)return;dt=Math.min(dt,.05)*speed;spawnClock-=dt;if(spawned<total&&spawnClock<=0){spawn();spawnClock=Math.max(.35,1.25-s.wave*.06)}castClock-=dt;if(castClock<=0&&cast('fire')){castClock=defs.fire.cd}boltClock-=dt;arcClock-=dt;if(s.skills.bolt>0&&boltClock<=0&&cast('bolt'))boltClock=defs.bolt.cd;if(s.skills.arc>0&&arcClock<=0&&cast('arc'))arcClock=defs.arc.cd;if(s.tree&&s.gem==='time'&&lastChainOrigin){childClock-=dt;if(childClock<=0){triggerChain(lastChainOrigin,'ice',1);childClock=[0,3,2,1][s.gemLevel]||3}}towerClock-=dt;if(s.tower&&towerClock<=0){let e=target();if(e){damage(e,12+s.tower*15,'tower');beam(300,300,e.x,e.y,'#b4ffd1');burst('tower',e.x,e.y,12+s.tower*15);towerClock=1.15}}for(let e of enemies){if(e.hp<=0)continue;e.reveal=Math.max(0,e.reveal-dt);e.slow=Math.max(0,e.slow-dt);if(e.kind==='burrow'){e.phase+=dt;if(e.phase%5<1.4)e.reveal=Math.max(e.reveal,.15)}if(e.burn>0){e.burn-=dt;e.hp-=5*dt;if(e.hp<=0){s.kills++;s.crystal+=2;continue}}let dx=300-e.x,dy=300-e.y,dist=Math.hypot(dx,dy)||1;if(dist>46){let v=e.speed*(e.slow>0?.55:1)*dt;e.x+=dx/dist*v;e.y+=dy/dist*v}else{e.attack-=dt;if(e.attack<=0){let d=e.kind==='boss'?50:e.kind==='armor'?24:13;let absorbed=Math.min(s.shield,d);s.shield-=absorbed;s.hp-=d-absorbed;effects.push({x:300+rand(-28,28),y:300+rand(-28,28),col:'#ff6e88',life:.42,max:.42,kind:'spark'});e.attack=e.kind==='fast'?.65:1.05;e.reveal=2}}}enemies=enemies.filter(e=>e.hp>0);shots=shots.filter(f=>(f.life-=dt)>0);for(const p of projectiles){p.life-=dt;if(p.life<=0)impact(p)}projectiles=projectiles.filter(p=>p.life>0);effects=effects.filter(f=>(f.life-=dt)>0);if(s.hp<=0){s.hp=0;active=false;save();dialog('💔 城堡失守','第 '+s.wave+' 波失守。重新挑戰可以嘗試不同的升級順序。',[['重新開始',()=>{s=fresh();reset();save()}]])}else if(spawned===total&&!enemies.length){active=false;s.highest=Math.max(s.highest,s.wave);s.shield=Math.min(s.shieldMax,s.shield+30);save();if(s.wave===10){won=true;dialog('🏆 試玩通關！','你完成了 10 波自由攻城挑戰。這是首版原型，完整 30 波與多分支技能樹仍待開發。',[['再玩一次',()=>{s=fresh();reset();save()}]])}else{let n=35+s.wave*8;dialog('🎁 第 '+s.wave+' 波完成','請選擇一項獎勵：',[['💎 +'+n+' 結晶',()=>{s.crystal+=n;save()}],['❤️ 修復 30% 城牆',()=>{s.hp=Math.min(s.max,s.hp+s.max*.3);s.crystal+=Math.floor(n*.3);save()}],['🛡️ 護盾補滿',()=>{s.shield=s.shieldMax;s.crystal+=Math.floor(n*.5);save()}]])}}}
function reset(){active=false;paused=false;won=false;enemies=[];shots=[];projectiles=[];effects=[];lastChainOrigin=null;chainCount=0;chainOriginCount=0;spawned=0;total=0;castClock=0;childClock=0;boltClock=0;arcClock=0;selected=null}
function burst(kind,x,y,amount){const col=kind==='fire'?'#ff9b42':kind==='ice'?'#8feaff':kind==='bolt'?'#ffe27b':kind==='arc'?'#d5a8ff':'#9bffcb';effects.push({x,y,col,life:.65,max:.65,kind,damage:Math.round(amount)});for(let i=0;i<9;i++){let a=Math.random()*6.283,r=10+Math.random()*23;effects.push({x:x+Math.cos(a)*r,y:y+Math.sin(a)*r,col,life:.35+Math.random()*.3,max:.65,kind:'spark'})}}
function draw(){g.clearRect(0,0,600,600);g.fillStyle='#183a31';g.fillRect(0,0,600,600);g.strokeStyle='#2b4b42';g.lineWidth=1;for(let p=0;p<=600;p+=40){g.beginPath();g.moveTo(p,0);g.lineTo(p,600);g.moveTo(0,p);g.lineTo(600,p);g.stroke()}g.strokeStyle='#71d9e366';g.setLineDash([7,8]);g.lineWidth=3;g.beginPath();g.arc(300,300,65+s.radar*48,0,Math.PI*2);g.stroke();g.setLineDash([]);g.save();g.shadowColor='#62c6ff';g.shadowBlur=14;g.fillStyle='#7d96b3';g.fillRect(264,274,72,65);g.restore();g.fillStyle='#496f9a';g.beginPath();g.moveTo(258,274);g.lineTo(300,240);g.lineTo(342,274);g.fill();g.fillStyle='#8ce8ff';g.beginPath();g.arc(300,302,13,0,7);g.fill();if(s.tower){g.fillStyle='#75eccb';g.fillRect(243,290,14,14);g.fillRect(343,290,14,14)}g.textAlign='center';g.font='bold 15px sans-serif';g.fillStyle='white';g.fillText('城堡',300,365);g.fillStyle='#16243c';g.fillRect(260,374,80,7);g.fillStyle='#77edb2';g.fillRect(260,374,80*Math.max(0,s.hp/s.max),7);for(const e of enemies){g.globalAlpha=visible(e)?1:.23;g.save();g.shadowColor=e.color;g.shadowBlur=e.kind==='boss'?24:9;g.fillStyle=e.color;g.beginPath();if(e.kind==='fly'){g.moveTo(e.x,e.y-e.radius);g.lineTo(e.x+e.radius,e.y+e.radius);g.lineTo(e.x-e.radius,e.y+e.radius)}else g.arc(e.x,e.y,e.radius,0,7);g.fill();g.restore();g.globalAlpha=1;g.fillStyle='#101722';g.fillRect(e.x-16,e.y-e.radius-10,32,4);g.fillStyle='#78e1a3';g.fillRect(e.x-16,e.y-e.radius-10,32*Math.max(0,e.hp/e.max),4);if(e.id===selected){g.strokeStyle='#ffed9a';g.lineWidth=2;g.beginPath();g.arc(e.x,e.y,e.radius+5,0,7);g.stroke()}}for(const f of shots){g.globalAlpha=Math.max(0,f.life/.23);g.fillStyle=f.col;g.beginPath();g.arc(f.x,f.y,12*(1-f.life/.23)+5,0,7);g.fill()}g.globalAlpha=1;for(const f of projectiles){let t=Math.min(1,1-f.life/f.max),x=f.ox+(f.tx-f.ox)*t,y=f.oy+(f.ty-f.oy)*t;g.save();g.globalAlpha=.9;g.strokeStyle=f.col;g.lineWidth=f.kind==='bolt'?4:3;g.shadowBlur=18;g.shadowColor=f.col;g.beginPath();g.moveTo(f.ox+(f.tx-f.ox)*Math.max(0,t-.18),f.oy+(f.ty-f.oy)*Math.max(0,t-.18));g.lineTo(x,y);g.stroke();g.fillStyle=f.col;g.beginPath();g.arc(x,y,f.kind==='fire'?11:7,0,Math.PI*2);g.fill();g.restore()}for(const f of effects){let t=Math.max(0,f.life/f.max);g.save();g.globalAlpha=t;g.fillStyle=f.col;g.strokeStyle=f.col;g.shadowColor=f.col;g.shadowBlur=13;if(f.kind==='beam'){g.lineWidth=5*t;g.beginPath();g.moveTo(f.x,f.y);g.lineTo(f.tx,f.ty);g.stroke()}else if(f.kind==='spark'){g.beginPath();g.arc(f.x+(1-t)*8,f.y-(1-t)*12,3*t+1,0,7);g.fill()}else{g.lineWidth=4*t;g.beginPath();g.arc(f.x,f.y,8+(1-t)*36,0,7);g.stroke();g.font='bold 18px system-ui';g.textAlign='center';g.fillText('-'+f.damage,f.x,f.y-22-(1-t)*28)}g.restore()}g.globalAlpha=1;if(!active){g.fillStyle='#09182ab0';g.fillRect(0,0,600,48);g.fillStyle='white';g.font='bold 21px sans-serif';g.fillText(won?'🎉 十波通關':'準備第 '+(s.wave+1)+' 波',300,31)}}
function render(){const stats=`<span class="stat">❤️ ${Math.ceil(s.hp)}/${s.max}</span><span class="stat">🛡️ ${Math.ceil(s.shield)}/${s.shieldMax}</span><span class="stat">💎 ${s.crystal}</span><span class="stat">🌊 ${s.wave}/10</span><span class="stat">💀 ${s.kills}</span>`;$('stats').innerHTML=stats;$('state').textContent=active?(paused?'已暫停':'戰鬥中'):'準備中';for(const [id,k] of [['skillFire','fire'],['skillIce','ice'],['skillBolt','bolt'],['skillArc','arc']])$(id).disabled=!s.skills[k];$('start').disabled=active||won;$('pause').textContent=paused?'▶ 繼續':'⏸ 暫停';$('speed').textContent='⏩ '+speed+'×';document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));let h='';if(tab==='fight')h=`<h2>⚔️ 自由戰場</h2><p class="muted">沒有固定路線。紫色怪物會潛行；藍色三角形代表飛行怪。點擊敵人可集火。</p><div class="line"><span>場上敵人</span><b>${enemies.length}</b></div><div class="line"><span>本波已出現</span><b>${spawned} / ${total||'—'}</b></div><button id="repair">🩹 緊急修復 +180（40 💎，每波一次）</button>`;if(tab==='magic'){h='<h2>✨ 魔法與寶石</h2><div class="row"><button class="primary" id="auto">🪄 一鍵自動安裝</button><button id="gem">切換命中／計時寶石</button><button id="gemUp">寶石升級 '+(s.gemLevel<3?(s.gemLevel*90)+' 💎':'MAX')+'</button></div><div class="node">'+(s.tree?'🔥 火球 Lv.'+s.skills.fire+'<br>↓<br>💠 '+(s.gem==='hit'?'命中寶石 '+(35+10*(s.gemLevel-1))+'%':'計時寶石 '+([0,3,2,1][s.gemLevel])+' 秒')+'<br>↓<br>❄️ 冰槍 Lv.'+s.skills.ice+(s.gemLevel>=2&&s.skills.bolt?'<br>↓<br>⚡ 雷擊 Lv.'+s.skills.bolt:''):'尚未安裝技能樹')+'</div>';for(const k of Object.keys(defs)){let lv=s.skills[k],cost=lv?upcost[lv-1]:({bolt:65,arc:55}[k]||0);h+=`<div class="line"><span>${defs[k].name} Lv.${lv}</span><button data-skill="${k}" ${lv>=5?'disabled':''}>${lv>=5?'MAX':(lv?'升級':'解鎖')+' '+cost+' 💎'}</button></div>`}h+='<p class="muted">連鎖從火球命中怪物的位置發動冰槍，不會再從城堡發射。計時寶石每 3 秒由最近一次命中位置觸發。寶石 Lv1/2/3 的計時分別為 3/2/1 秒；Lv2 可讓冰槍命中時有機率從冰槍命中位置連鎖雷擊。</p>'}if(tab==='castle'){h='<h2>🏰 城堡升級</h2>';for(const [k,n,d] of [['wall','城牆','每級 +250 最大生命'],['tower','自動箭塔','自動攻擊接近敵人'],['radar','魔力雷達','偵測潛行怪並增加護盾']]){let lv=s[k],cost=[35,60,95,140][lv];h+=`<div class="line"><span><b>${n} Lv.${lv}</b><br><span class="small">${d}</span></span><button data-castle="${k}" ${lv>=4?'disabled':''}>${lv>=4?'MAX':cost+' 💎'}</button></div>`}}if(tab==='info')h=`<h2>📖 試玩內容</h2><p class="muted">最高波次：${s.highest}<br>擊殺總數：${s.kills}<br>已完成：自由進攻、10 波、基本法術、寶石連鎖、一鍵安裝、城堡升級、潛行／飛行怪與 Boss。</p><p class="muted">尚未完成：完整 DAG 技能樹、召喚軍團、鑽地怪、30 波、自由建築部署與完整 PWA 安裝檔。</p><button id="reset">🗑️ 重開新局</button>`;$('panel').innerHTML=h;let b=$('auto');if(b)b.onclick=auto;b=$('gemUp');if(b)b.onclick=()=>{if(active&&!paused)return note('請先暫停');if(s.gemLevel>=3)return note('寶石已滿級');if(spend(s.gemLevel*90)){s.gemLevel++;save();render();note('寶石升到 Lv.'+s.gemLevel)}};b=$('gem');if(b)b.onclick=()=>{if(active&&!paused)return note('請先暫停');s.gem=s.gem==='hit'?'time':'hit';childClock=[0,3,2,1][s.gemLevel];save();render()};document.querySelectorAll('[data-skill]').forEach(b=>b.onclick=()=>upgradeSkill(b.dataset.skill));document.querySelectorAll('[data-castle]').forEach(b=>b.onclick=()=>upgradeCastle(b.dataset.castle));b=$('repair');if(b)b.onclick=()=>{if(!active||usedRepair)return note('每波戰鬥中限修復一次');if(spend(40)){s.hp=Math.min(s.max,s.hp+180);usedRepair=true;render()}};b=$('reset');if(b)b.onclick=()=>dialog('確認重新開始？','會清除這個瀏覽器內的試玩進度。',[['取消',()=>{}],['確定',()=>{s=fresh();reset();save()}]])}
$('start').onclick=()=>{if(active||won)return;if(!s.tree)auto();s.wave++;active=true;paused=false;enemies=[];shots=[];projectiles=[];effects=[];lastChainOrigin=null;chainCount=0;chainOriginCount=0;spawned=0;total=8+s.wave*3+(s.wave===10?1:0);spawnClock=.1;castClock=0;childClock=[0,3,2,1][s.gemLevel];lastChainOrigin=null;chainCount=0;chainOriginCount=0;towerClock=0;boltClock=0;arcClock=0;usedRepair=false;selected=null;note('第 '+s.wave+' 波開始！怪物從四面八方進攻。');render()};$('pause').onclick=()=>{if(active){paused=!paused;render()}};$('speed').onclick=()=>{speed=speed===1?2:speed===2?3:1;render()};for(const [id,k] of [['skillFire','fire'],['skillIce','ice'],['skillBolt','bolt'],['skillArc','arc']]){$(id).onclick=()=>{if(!active||paused||modal)return note('請先開始波次');if(!s.skills[k])return note('請先到魔法頁解鎖');if(cast(k))note('手動施放：'+defs[k].name)}}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});cv.addEventListener('pointerdown',ev=>{let r=cv.getBoundingClientRect(),x=(ev.clientX-r.left)/r.width*600,y=(ev.clientY-r.top)/r.height*600;let e=enemies.find(e=>visible(e)&&Math.hypot(e.x-x,e.y-y)<e.radius+20);selected=e?.id||null;note(e?'已指定集火目標':'已取消集火目標')});function loop(t){let dt=last?(t-last)/1000:0;last=t;try{update(dt);draw()}catch(err){$('state').textContent='執行錯誤';note('錯誤：'+err.message);console.error(err);return}uiClock+=dt;if(uiClock>.4){uiClock=0;$('stats').innerHTML=`<span class="stat">❤️ ${Math.ceil(s.hp)}/${s.max}</span><span class="stat">🛡️ ${Math.ceil(s.shield)}/${s.shieldMax}</span><span class="stat">💎 ${s.crystal}</span><span class="stat">🌊 ${s.wave}/10</span><span class="stat">💀 ${s.kills}</span>`;$('state').textContent=active?(paused?'已暫停':'戰鬥中'):'準備中'}requestAnimationFrame(loop)}document.addEventListener('visibilitychange',()=>{if(document.hidden&&active){paused=true;render();save()}});window.addEventListener('error',e=>{note('程式錯誤：'+e.message)});render();requestAnimationFrame(loop)})();
</script></body></html>
