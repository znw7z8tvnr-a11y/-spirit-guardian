<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101a30"><title>靈境守衛 v1.9｜30 波整合測試</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1426;color:#eef5ff;font:14px -apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif}main{max-width:620px;margin:auto;padding:12px}h1{font-size:22px;margin:2px 0}h2{font-size:16px;margin:4px 0 10px}button{background:#243a59;color:white;border:1px solid #577398;border-radius:10px;padding:11px 8px;font:inherit;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.45}.primary{background:#276e9c;border-color:#6eb9f0;font-weight:bold}.top{display:flex;justify-content:space-between;align-items:center}.small{font-size:12px;color:#b8c9e4}.stats{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.stat{background:#1a2b46;border-radius:7px;padding:7px;font-size:12px}canvas{width:100%;aspect-ratio:1;display:block;background:#18382f;border:1px solid #53716d;border-radius:13px;touch-action:none}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:9px 0}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0 8px}.tabs button{padding:10px 2px}.tabs .on{background:#3b709d}.panel{background:#182841;border:1px solid #324a6d;border-radius:13px;padding:12px;min-height:175px}.line{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:9px 0}.line button{min-width:98px}.node{background:#263c5d;border-radius:9px;padding:12px;line-height:1.9;margin:10px 0}.notice{background:#243a55;border-radius:8px;padding:10px;margin:8px 0;min-height:36px}.muted{font-size:12px;line-height:1.6;color:#bdcbe1}.row{display:flex;flex-wrap:wrap;gap:7px}.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;margin:8px 0}.quick button{padding:9px 2px;font-size:12px;background:#30445e}.quick button:disabled{opacity:.32}canvas{max-height:min(72vh,620px);object-fit:contain}.overlay{z-index:20;position:fixed;inset:0;background:#06101ce8;display:none;align-items:center;justify-content:center;padding:20px}.dialog{max-width:430px;width:100%;background:#1d2e4a;border:1px solid #7292b6;border-radius:15px;padding:18px}.dialog button{margin:5px 5px 0 0}.panel button{margin-bottom:4px}.notice{border-left:3px solid #6bbff2}.stat{font-variant-numeric:tabular-nums}select{background:#162d4a;color:#eef5ff;border:1px solid #456383;border-radius:8px;padding:9px;max-width:100%;font-size:13px}</style></head><body><main><div class="top"><div><h1>🏰 靈境守衛</h1><div class="small">手機整合測試版 v1.9 · 30 波挑戰 · 存檔備份</div></div><div class="small" id="state">準備中</div></div><div class="stats" id="stats"></div><canvas id="field" width="600" height="600"></canvas><div class="actions"><button class="primary" id="start">▶ 開始波次</button><button id="pause">⏸ 暫停</button><button id="speed">⏩ 1×</button></div><div class="quick"><button id="skillFire">🔥 火球</button><button id="skillIce">❄️ 冰槍</button><button id="skillBolt">⚡ 雷擊</button><button id="skillArc">🔮 奧術</button></div><div class="notice" id="notice">先到「魔法」按一鍵自動安裝，再開始防守。</div><div class="tabs"><button class="on" data-tab="fight">⚔️ 戰鬥</button><button data-tab="magic">✨ 魔法</button><button data-tab="castle">🏰 城堡</button><button data-tab="info">📖 研究</button></div><div class="panel" id="panel"></div><p class="muted">玩法：怪物從四面八方自由靠近。點擊敵人指定優先目標。波次間可升級技能、城堡；進度自動儲存在目前瀏覽器。</p></main><div class="overlay" id="overlay"><div class="dialog"><h2 id="dialogTitle"></h2><div id="dialogText"></div><div id="dialogButtons" class="row"></div></div></div><script>
(()=>{'use strict';const $=id=>document.getElementById(id),cv=$('field'),g=cv.getContext('2d');const defs={fire:{name:'火球',d:30,cd:1.5,col:'#ff9456'},ice:{name:'冰槍',d:24,cd:1.2,col:'#a2e8ff'},bolt:{name:'雷擊',d:36,cd:2,col:'#ffe27b'},arc:{name:'奧術飛彈',d:22,cd:.7,col:'#d5a8ff'}};const fresh=()=>({v:3,wave:0,crystal:110,hp:1000,max:1000,shield:150,shieldMax:150,wall:0,tower:0,radar:0,skills:{fire:1,ice:1,bolt:0,arc:0},gem:'hit',gemLevel:1,tree:false,kills:0,highest:0,forts:[],summon:0,archers:0,golems:0,elementals:0,specialty:"balanced",core:0,branchIce:true,branchBolt:true,branchArc:false,autoGem:true,chainEdges:null,targetMode:0,bossWins:0,damageDealt:0});let s=fresh();try{const o=JSON.parse(localStorage.getItem('spirit-guardian-demo-v1'));if(o&&(o.v===1||o.v===2||o.v===3)&&o.skills)s={...fresh(),...o,v:3,gemLevel:o.gemLevel||1,forts:o.forts||[]}}catch(e){}const chainSkills=['fire','ice','bolt','arc'];
const defaultEdges=()=>[{from:'fire',to:'ice',gem:'hit',level:1}];
function validEdges(edges){if(!Array.isArray(edges)||edges.length>8)return false;let seen=new Set();for(const e of edges){if(!e||!chainSkills.includes(e.from)||!chainSkills.includes(e.to)||e.from===e.to||!['hit','time'].includes(e.gem)||!Number.isInteger(e.level)||e.level<1||e.level>3)return false;let key=e.from+'>'+e.to;if(seen.has(key))return false;seen.add(key)}let adj={};for(const k of chainSkills)adj[k]=[];for(const e of edges)adj[e.from].push(e.to);let visited=new Set(),path=new Set();function dfs(k){if(path.has(k))return false;if(visited.has(k))return true;path.add(k);for(const n of adj[k])if(!dfs(n))return false;path.delete(k);visited.add(k);return true}return chainSkills.every(dfs)}
if(!validEdges(s.chainEdges))s.chainEdges=defaultEdges();if(!['balanced','guardian','arcane','artillery'].includes(s.specialty))s.specialty='balanced';s.golems=Math.max(0,Math.min(2,Math.floor(Number(s.golems)||0)));s.elementals=Math.max(0,Math.min(2,Math.floor(Number(s.elementals)||0)));if(!Array.isArray(s.forts))s.forts=[];s.forts=s.forts.filter(f=>f&&Number.isFinite(f.x)&&Number.isFinite(f.y)&&f.x>=0&&f.x<=600&&f.y>=0&&f.y<=600).slice(0,5);if(!Number.isFinite(s.hp)||s.hp<0||!Number.isFinite(s.max)||s.max<=0||!Number.isFinite(s.crystal)||s.crystal<0){s=fresh();s.chainEdges=defaultEdges()}
let graphUndo=null,edgeTimers={},edgeArmed={},graphEventCount=0;
function graphVisual(){
 const names={fire:'🔥 火球',ice:'❄️ 冰槍',bolt:'⚡ 雷擊',arc:'🔮 奧術'};
 const levels={fire:0,ice:0,bolt:0,arc:0};
 for(let pass=0;pass<4;pass++)for(const e of s.chainEdges)levels[e.to]=Math.max(levels[e.to],Math.min(3,levels[e.from]+1));
 const layers=[[],[],[],[]];for(const k of chainSkills)layers[levels[k]].push(k);
 const coords={};for(let d=0;d<4;d++)layers[d].forEach((k,i)=>coords[k]={x:60+d*110,y:55+(i-(layers[d].length-1)/2)*64});
 let svg='<svg viewBox="0 0 455 205" role="img" aria-label="魔法技能樹：箭頭代表連鎖方向" style="width:100%;height:auto;background:#101d34;border-radius:12px"><defs><marker id="arrowMagic" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#eaf4ff" stroke-width="1.5"/></marker></defs>';
 for(const e of s.chainEdges){let f=coords[e.from],t=coords[e.to],c=e.gem==='hit'?'#ffba71':'#8ae5ff';svg+='<path d="M'+(f.x+32)+' '+f.y+' L'+(t.x-34)+' '+t.y+'" stroke="'+c+'" stroke-width="2.8" marker-end="url(#arrowMagic)" fill="none"/><text x="'+((f.x+t.x)/2)+'" y="'+((f.y+t.y)/2-8)+'" fill="'+c+'" font-size="10" text-anchor="middle">'+(e.gem==='hit'?'命中':'計時')+' Lv'+e.level+'</text>'}
 for(const k of chainSkills){const p=coords[k];svg+='<rect x="'+(p.x-33)+'" y="'+(p.y-19)+'" width="66" height="38" rx="9" fill="'+(s.skills[k]?'#314d63':'#273142')+'" stroke="#6e8eab"/><text x="'+p.x+'" y="'+(p.y+4)+'" font-size="11" fill="white" text-anchor="middle">'+names[k]+'</text>'}
 return svg+'</svg><p class="muted">橘線＝命中；藍線＝計時。箭頭顯示母技能 → 子技能。</p>';
}
function graphSet(edges){if(!validEdges(edges))return note('無法連接：重複、循環或超出容量');graphUndo=JSON.stringify(s.chainEdges);s.chainEdges=edges;edgeTimers={};edgeArmed={};save();render();note('技能樹已更新，可以撤銷')}
function graphAuto(){let e=[{from:'fire',to:'ice',gem:s.gem,level:s.gemLevel}];if(s.skills.bolt>0)e.push({from:'ice',to:'bolt',gem:'hit',level:Math.min(3,s.gemLevel)});if(s.skills.arc>0)e.push({from:'fire',to:'arc',gem:'time',level:1});if(!validEdges(e))return note('自動配置失敗');graphSet(e);s.tree=true;save();render();note('智慧安裝完成：連鎖從每個命中位置發動')}
function graphEvent(skill,origin,depth){if(!s.tree||depth>=4||graphEventCount>=90)return;for(let i=0;i<s.chainEdges.length;i++){const e=s.chainEdges[i];if(e.from!==skill||!s.skills[e.to])continue;if(e.gem==='hit'){if(Math.random()<.35+.1*(e.level-1)){if(triggerChain(origin,e.to,depth+1))graphEventCount++}}else{if(!edgeArmed[i]){edgeArmed[i]={x:origin.x,y:origin.y,depth};edgeTimers[i]=[0,3,2,1][e.level];}}}}
function graphTick(dt){for(let i=0;i<s.chainEdges.length;i++){let e=s.chainEdges[i];if(e.gem!=='time'||!edgeArmed[i])continue;edgeTimers[i]-=dt;if(edgeTimers[i]<=0){let o=edgeArmed[i];if(o&&o.x!==undefined){if(graphEventCount<90&&triggerChain(o,e.to,Math.min(3,o.depth+1)))graphEventCount++;}edgeTimers[i]+=[0,3,2,1][e.level];if(edgeTimers[i]<0)edgeTimers[i]=[0,3,2,1][e.level];}}}
let lowFx=false;try{lowFx=localStorage.getItem('sg-lowfx')==='1'}catch(e){}let placing=false,summons=[],effects=[],projectiles=[],chainCount=0,lastChainOrigin=null,chainOriginCount=0,active=false,paused=false,modal=false,won=false,tab='fight',speed=1,enemies=[],shots=[],spawned=0,total=0,spawnClock=0,castClock=0,childClock=0,towerClock=0,boltClock=0,arcClock=0,selected=null,seq=0,last=0,uiClock=0,usedRepair=false,manualCooldown={fire:0,ice:0,bolt:0,arc:0},timerStarted=false,waveElapsed=0,bossAlert=false,combatLog=[],waveChains=0,waveDamage=0,debugMode=false;const save=()=>{try{localStorage.setItem('spirit-guardian-demo-v1',JSON.stringify(s))}catch(e){}};const note=t=>{$('notice').textContent=t;combatLog.unshift(t);if(combatLog.length>8)combatLog.pop()};const rand=(a,b)=>a+Math.random()*(b-a);const spend=n=>{if(s.crystal<n){note('魔力結晶不足');return false}s.crystal-=n;return true};const upcost=[20,45,90,160];function upgradeSkill(k){if(active&&!paused)return note('請先暫停');let lv=s.skills[k],price=lv?upcost[lv-1]:({bolt:65,arc:55}[k]||0);if(lv>=5)return;if(spend(price)){s.skills[k]++;save();render();note(defs[k].name+' 升級成功')}}function upgradeCastle(k){if(active&&!paused)return note('請先暫停');let lv=s[k],price=[35,60,95,140][lv];if(lv>=4)return;if(spend(price)){s[k]++;if(k==='wall'){s.max+=250;s.hp+=250}if(k==='radar'){s.shieldMax+=50;s.shield+=50}save();render();note('城堡強化成功')}}function auto(){if(active&&!paused)return note('請先暫停');graphAuto()}
function dialog(title,text,buttons){modal=true;paused=true;$('overlay').style.display='flex';$('dialogTitle').textContent=title;$('dialogText').textContent=text;const root=$('dialogButtons');root.innerHTML='';buttons.forEach(b=>{let btn=document.createElement('button');btn.textContent=b[0];btn.onclick=()=>{$('overlay').style.display='none';modal=false;b[1]();render()};root.appendChild(btn)})}
function spawn(){let w=s.wave,r=Math.random(),kind='normal';if(w>=7&&r<.16)kind='stealth';else if(w>=8&&r<.26)kind='burrow';else if(w>=5&&r<.39)kind='fly';else if(w>=13&&r<.57)kind='resist';else if(w>=11&&r<.66)kind='split';else if(w>=4&&r<.73)kind='armor';else if(w>=2&&r<.88)kind='fast';if(w%10===0&&spawned===total-1)kind='boss';let cfg={normal:[1,23,12,'#edbc84'],fast:[.7,36,10,'#f5dc6d'],armor:[2.2,14,15,'#b9a3cc'],stealth:[.8,30,11,'#a97bff'],fly:[.8,34,12,'#7bdcf0'],burrow:[1.3,19,12,'#c69c65'],resist:[1.5,22,13,'#8a83ff'],split:[.9,27,14,'#ee9fd6'],boss:[11+(w>=20?5:0)+(w>=30?8:0),12,26,'#ff658e']}[kind];let a=rand(0,Math.PI*2),r0=rand(285,299),hp=60*Math.pow(1.1,w-1)*cfg[0];enemies.push({id:++seq,x:300+Math.cos(a)*r0,y:300+Math.sin(a)*r0,hp,max:hp,speed:cfg[1],radius:cfg[2],color:cfg[3],kind,attack:0,reveal:0,slow:0,burn:0,phase:rand(0,5),splitDone:false,bossName:kind==='boss'?(w===10?'熔岩巨人':w===20?'暗影王・夜魘':'虛空觀察者'):''});spawned++;if(kind==='boss'){bossAlert=true;note('⚠️ '+enemies[enemies.length-1].bossName+' 已降臨！')}}
function visible(e){return (e.kind!=='stealth'&&e.kind!=='burrow')||e.reveal>0||Math.hypot(e.x-300,e.y-300)<65+s.radar*48+s.summon*8}function target(){let es=enemies.filter(e=>e.hp>0&&visible(e));let chosen=es.find(e=>e.id===selected);if(chosen)return chosen;return es.sort((a,b)=>{if(s.targetMode===1)return a.hp-b.hp;if(s.targetMode===2)return b.hp-a.hp;if(s.targetMode===3)return (b.kind==='boss')-(a.kind==='boss');return Math.hypot(a.x-300,a.y-300)-Math.hypot(b.x-300,b.y-300)})[0]}
function damage(e,amount,kind){if(e.hp<=0)return false;const before=e.hp;let dealt=amount*(e.kind==='armor'&&kind!=='bolt'?.72:e.kind==='resist'&&['fire','ice','bolt','arc'].includes(kind)?.5:1);if(s.specialty==='arcane'&&['fire','ice','bolt','arc'].includes(kind))dealt*=1.18;e.hp-=dealt;s.damageDealt+=Math.min(before,dealt);waveDamage+=Math.min(before,dealt);if(kind==='fire'){e.burn=Math.max(e.burn,2);e.reveal=2.5}if(kind==='ice'){e.slow=2;effects.push({x:e.x,y:e.y,col:'#9aeaff',life:.48,max:.48,kind:'spark'})}if(kind==='bolt'||kind==='arc')e.reveal=2;if(e.hp<=0){onKill(e)}return before>0}
function onKill(e){if(e.rewarded)return;e.rewarded=true;s.kills++;s.crystal+=e.kind==='boss'?70:2+Math.floor(s.wave/5);if(e.kind==='boss'){s.bossWins=(s.bossWins||0)+1;note('👑 擊敗 '+e.bossName+'！')}if(e.kind==='split'&&!e.splitDone){e.splitDone=true;for(let i=0;i<2;i++){let a=i*Math.PI+rand(-.4,.4);enemies.push({id:++seq,x:e.x+Math.cos(a)*17,y:e.y+Math.sin(a)*17,hp:Math.max(10,e.max*.22),max:Math.max(10,e.max*.22),speed:33,radius:8,color:'#ffb3df',kind:'minion',attack:0,reveal:2,slow:0,burn:0,phase:0})}}}
function setTargetMode(){s.targetMode=((Number.isInteger(s.targetMode)?s.targetMode:0)+1)%4;save();render();note('🎯 攻擊策略：'+['最近城堡','最低生命','最高生命','優先 Boss'][s.targetMode])}
function cast(k,origin,targetEnemy,depth=0){let e=targetEnemy&&targetEnemy.hp>0?targetEnemy:target();if(!e||!s.skills[k])return false;let d=defs[k],amount=d.d*[1,1.2,1.45,1.75,2.1][s.skills[k]-1];let ox=origin?origin.x:300,oy=origin?origin.y:300;if(projectiles.length>=130)return false;projectiles.push({kind:k,ox,oy,tx:e.x,ty:e.y,target:e,amount,depth,life:k==='bolt'?.18:.32,max:k==='bolt'?.18:.32,col:d.col});return true}
function impact(p){
 let e=p.target,x=e&&e.hp>0?e.x:p.tx,y=e&&e.hp>0?e.y:p.ty;
 const origin={x,y};let hit=false;
 if(p.kind==='fire'){
  const victims=enemies.filter(z=>z.hp>0&&Math.hypot(z.x-x,z.y-y)<48);
  for(const z of victims)hit=damage(z,p.amount,'fire')||hit;
 }else if(e&&e.hp>0){
  hit=damage(e,p.amount,p.kind);
  if(p.kind==='bolt'){
   for(const z of enemies.filter(z=>z!==e&&z.hp>0&&Math.hypot(z.x-x,z.y-y)<85).slice(0,2)){
    beam(x,y,z.x,z.y,'#ffe27b');damage(z,p.amount*.4,'bolt')
   }
  }
 }

 // Every next skill originates at the exact previous impact coordinate.
 if(hit&&s.tree&&p.depth<4&&chainCount<75){lastChainOrigin=origin;graphEvent(p.kind,origin,p.depth)}
}
function triggerChain(origin,skill='ice',depth=1){
 if(!origin||!s.skills[skill]||chainCount>=75)return false;
 let options=enemies.filter(e=>e.hp>0&&visible(e));
 if(!options.length)return false;
 options.sort((a,b)=>Math.hypot(a.x-origin.x,a.y-origin.y)-Math.hypot(b.x-origin.x,b.y-origin.y));

 if(cast(skill,origin,e,depth)){
  chainCount++;waveChains++;beam(origin.x,origin.y,e.x,e.y,defs[skill].col);
  return true
 }
 return false
}
function beam(x1,y1,x2,y2,col){effects.push({kind:'beam',x:x1,y:y1,tx:x2,ty:y2,col,life:.28,max:.28})}
function defenseTick(dt){
 // Independently placed towers have independent cooldowns and range.
 for(const f of s.forts){f.cd=Math.max(0,(f.cd||0)-dt);if(f.cd>0)continue;
  const e=enemies.filter(e=>e.hp>0&&visible(e)&&Math.hypot(e.x-f.x,e.y-f.y)<170).sort((a,b)=>s.targetMode===1?a.hp-b.hp:s.targetMode===2?b.hp-a.hp:s.targetMode===3?((b.kind==='boss')-(a.kind==='boss'))||Math.hypot(a.x-f.x,a.y-f.y)-Math.hypot(b.x-f.x,b.y-f.y):Math.hypot(a.x-f.x,a.y-f.y)-Math.hypot(b.x-f.x,b.y-f.y))[0];
  if(e){beam(f.x,f.y,e.x,e.y,'#8fffd3');damage(e,(18+s.tower*8)*(s.specialty==='artillery'?1.3:1),'tower');burst('tower',e.x,e.y,18+s.tower*8);f.cd=Math.max(.4,1.25-s.core*.12)}
 }
 towerClock-=dt;if(s.tower>0&&towerClock<=0){let e=target();if(e&&Math.hypot(e.x-300,e.y-300)<250){beam(300,300,e.x,e.y,'#c0ffd5');damage(e,(12+s.tower*15)*(s.specialty==='artillery'?1.3:1),'tower');towerClock=Math.max(.4,1.15-s.core*.1)}}
 for(const u of summons){u.cd=Math.max(0,(u.cd||0)-dt);let e=enemies.filter(e=>e.hp>0&&visible(e)).sort((a,b)=>Math.hypot(a.x-u.x,a.y-u.y)-Math.hypot(b.x-u.x,b.y-u.y))[0];if(!e)continue;
  let dist=Math.hypot(e.x-u.x,e.y-u.y);let range=u.type==='archer'?145:u.type==='elemental'?165:u.type==='golem'?34:31;if(dist>range){let step=Math.min(dist-range,(u.type==='golem'?24:42)*dt);u.x+=(e.x-u.x)/dist*step;u.y+=(e.y-u.y)/dist*step}else if(u.cd<=0){beam(u.x,u.y,e.x,e.y,u.type==='archer'?'#fbe9a2':u.type==='elemental'?'#ff9d52':u.type==='golem'?'#a4d3b8':'#d6b6ff');const power=(u.type==='archer'?11:u.type==='golem'?32:u.type==='elemental'?20:14)+s.core*4;damage(e,power,u.type==='elemental'?'fire':'summon');if(u.type==='golem')for(const z of enemies.filter(z=>z!==e&&z.hp>0&&Math.hypot(z.x-e.x,z.y-e.y)<38).slice(0,3))damage(z,power*.35,'summon');if(u.type==='elemental')burst('fire',e.x,e.y,power);u.cd=u.type==='archer'?1.25:u.type==='golem'?2.1:u.type==='elemental'?1.4:.9}
